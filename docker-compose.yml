version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lexai-backend
    ports:
      - "8000:8000"
    environment:
      - IBM_WATSONX_API_KEY=${IBM_WATSONX_API_KEY}
      - IBM_WATSONX_PROJECT_ID=${IBM_WATSONX_PROJECT_ID}
      - IBM_WATSONX_URL=${IBM_WATSONX_URL:-https://us-south.ml.cloud.ibm.com}
      - IBM_DISCOVERY_API_KEY=${IBM_DISCOVERY_API_KEY}
      - IBM_DISCOVERY_URL=${IBM_DISCOVERY_URL}
      - IBM_DISCOVERY_PROJECT_ID=${IBM_DISCOVERY_PROJECT_ID}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/vector_store:/app/vector_store
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: lexai-frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: lexai-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  uploads:
  vector_store:
